<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>{% block title %}outreach engine{% endblock %}</title>
<style>
  :root { color-scheme: dark; }
  body { background:#0f1420; color:#e8ecf4; font-family: -apple-system, sans-serif; margin:0; }
  header { display:flex; justify-content:space-between; align-items:center; padding:1rem 1.5rem; border-bottom:1px solid #232b3d; }
  nav a { color:#a8b3c7; text-decoration:none; margin-right:1.25rem; font-size:0.95rem; }
  nav a:hover { color:#7dc4ff; }
  main { padding:1.5rem; max-width:1100px; margin:0 auto; }
  table { width:100%; border-collapse: collapse; margin-top:1rem; }
  th, td { text-align:left; padding:0.5rem 0.75rem; border-bottom:1px solid #232b3d; font-size:0.9rem; vertical-align:top; }
  th { color:#a8b3c7; font-weight:600; }
  .badge { display:inline-block; padding:0.1rem 0.5rem; border-radius:4px; font-size:0.8rem; }
  .badge.mock { background:#3a3115; color:#e8c86a; }
  .badge.ok { background:#123a1f; color:#6ae88a; }
  .badge.warn { background:#3a1515; color:#e86a6a; }
  a.link { color:#7dc4ff; }
  textarea, button, select, input[type="text"], input[type="number"] { font-family:inherit; font-size:0.9rem; }
  select, input[type="text"], input[type="number"], textarea { background:#171d2c; color:#e8ecf4; border:1px solid #2f3c5c; border-radius:6px; padding:0.35rem 0.6rem; }
  button { background:#1c2740; color:#e8ecf4; border:1px solid #2f3c5c; border-radius:6px; padding:0.35rem 0.8rem; cursor:pointer; }
  button:hover { background:#243154; }
  .card { background:#171d2c; border:1px solid #232b3d; border-radius:8px; padding:1rem 1.25rem; margin-bottom:1rem; }
  .mock-banner { background:#3a3115; color:#e8c86a; padding:0.6rem 1rem; border-radius:6px; margin-bottom:1rem; font-size:0.9rem; }
  form.stacked label { display:block; margin-bottom:0.75rem; font-size:0.85rem; color:#a8b3c7; }
  form.stacked input, form.stacked select, form.stacked textarea { display:block; width:100%; margin-top:0.25rem; box-sizing:border-box; }
</style>
</head>
<body>
<header>
  <nav>
    <a href="/">Clients</a>
  </nav>
  <div>
    <span>{{ user_email }}</span>
    &nbsp;<a href="/logout" class="link">Log out</a>
  </div>
</header>
<main>
{% if sourcing_mode == 'mock' %}
<div class="mock-banner">Sourcing is in MOCK mode -- target lists below are fixture data, not real sponsors/guests. See outreach/SETUP_CHECKLIST.md.</div>
{% endif %}
{% block content %}{% endblock %}
</main>
</body>
</html>
