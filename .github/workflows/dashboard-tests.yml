name: dashboard tests

# Scoped to dashboard/ only -- the rest of this repo is Apps Script (.gs
# files, no test infra, deployed via clasp, not CI), so there's no reason
# for a .gs-only commit to trigger a Python test run.
on:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - ".github/workflows/dashboard-tests.yml"
  pull_request:
    paths:
      - "dashboard/**"
      - ".github/workflows/dashboard-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest tests/ -v
